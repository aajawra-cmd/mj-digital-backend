<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJ DIGITAL - Admin Management Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }
        .admin-card { background: #1e293b; border-radius: 16px; border: 1px solid #334155; }
        .form-control, .form-select { background-color: #0f172a; border-color: #334155; color: #fff; }
        .form-control:focus { background-color: #0f172a; color: #fff; }
    </style>
</head>
<body class="py-4">
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-primary"><i class="fa-solid fa-user-gear me-2"></i> Admin Control Center</h2>
        <a href="/" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-store me-1"></i> View Live Store</a>
    </div>

    <div class="row g-4">
        <!-- Panel 1: Discount & Pricing Controls -->
        <div class="col-md-5">
            <div class="admin-card p-4">
                <h4 class="fw-bold mb-3 text-warning"><i class="fa-solid fa-tags me-2"></i> Pricing & Discount Manager</h4>
                <div class="mb-3">
                    <label class="form-label">Product Name</label>
                    <input type="text" id="adminTitle" class="form-control" value="iPhone 17 Pro">
                </div>
                <div class="mb-3">
                    <label class="form-label">Sale Price (₹)</label>
                    <input type="number" id="adminPrice" class="form-control" value="149999">
                </div>
                <div class="mb-3">
                    <label class="form-label">Original Price (Crossed Price ₹)</label>
                    <input type="number" id="adminOrigPrice" class="form-control" value="159999">
                </div>
                <button class="btn btn-primary w-100 fw-bold py-2" onclick="saveStoreData()">
                    <i class="fa-solid fa-floppy-disk me-1"></i> Update Live Store Prices
                </button>
            </div>
        </div>

        <!-- Panel 2: Live Bookings, Purchases & Enquiries -->
        <div class="col-md-7">
            <div class="admin-card p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="fw-bold text-success mb-0"><i class="fa-solid fa-bell me-2"></i> Live Bookings & Enquiries</h4>
                    <button class="btn btn-sm btn-outline-danger" onclick="clearBookings()"><i class="fa-solid fa-trash me-1"></i> Clear Log</button>
                </div>
                <div id="bookingList" style="max-height: 400px; overflow-y: auto;"></div>
            </div>
        </div>
    </div>
</div>

<script>
    function saveStoreData() {
        const title = document.getElementById('adminTitle').value;
        const price = parseFloat(document.getElementById('adminPrice').value);
        const origPrice = parseFloat(document.getElementById('adminOrigPrice').value);

        localStorage.setItem('adminProductData', JSON.stringify({ title, price, origPrice }));
        alert("✅ Live store prices and discount updated!");
    }

    function renderBookings() {
        const bookings = JSON.parse(localStorage.getItem('adminBookings')) || [];
        const container = document.getElementById('bookingList');
        if(bookings.length === 0) {
            container.innerHTML = "<p class='text-muted small'>No bookings or enquiries received yet.</p>";
            return;
        }
        container.innerHTML = bookings.map(b => `
            <div class="border border-secondary p-3 rounded mb-2 bg-dark">
                <div class="d-flex justify-content-between">
                    <strong class="text-info">${b.id} (${b.type})</strong>
                    <span class="badge bg-warning text-dark">${b.date}</span>
                </div>
                <div class="mt-1"><strong>Customer:</strong> ${b.customerName || 'Direct Online Buyer'} | ${b.phone || 'N/A'}</div>
                <div class="small text-light"><strong>Details:</strong> ${b.details}</div>
                <div class="fw-bold text-success mt-1">Amount: ₹${b.amount}</div>
            </div>
        `).join('');
    }

    function clearBookings() {
        localStorage.removeItem('adminBookings');
        renderBookings();
    }

    window.onload = renderBookings;
</script>
</body>
</html>
