<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJ Digital - Dynamic Category Admin Portal</title>
    <!-- FontAwesome & Bootstrap 5 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f1f5f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .admin-card { border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .category-tab-btn { border-radius: 20px; font-weight: 600; padding: 8px 18px; }
        .category-tab-btn.active { background-color: #4f46e5 !important; color: white !important; }
        .spec-row { background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Main Content -->
        <main class="col-12 px-md-4 py-4">
            
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center pb-3 mb-4 border-bottom">
                <h1 class="h3 fw-bold text-dark"><i class="fa-solid fa-sliders text-primary me-2"></i>MJ Digital Admin Portal</h1>
                <a href="/" target="_blank" class="btn btn-outline-primary btn-sm rounded-pill"><i class="fa-solid fa-globe me-1"></i> View Live Site</a>
            </div>

            <!-- Add / Edit Item Form Card -->
            <div class="card admin-card p-4 mb-4 bg-white">
                <h4 class="fw-bold mb-3" id="formTitle"><i class="fa-solid fa-circle-plus text-success me-2"></i>Add New Product / Package</h4>
                
                <div id="adminAlert"></div>

                <form id="itemForm">
                    <input type="hidden" id="itemId">
                    <div class="row g-3">
                        <!-- Select Category -->
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Category *</label>
                            <select id="itemCategory" class="form-select" onchange="handleCategoryChange()" required>
                                <option value="" selected disabled>-- Select Category --</option>
                                <option value="Electronics">Electronics</option>
                                <option value="Mobile">Mobile & Accessories</option>
                                <option value="Travel">Travel Package</option>
                                <option value="Fashion">Fashion & Apparel</option>
                                <option value="Service">Digital Service</option>
                                <option value="Home">Home Essentials</option>
                            </select>
                        </div>

                        <!-- Sub-Category / Type -->
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Type / Sub-Category</label>
                            <input type="text" id="itemSubCategory" class="form-control" placeholder="e.g. Laptop, TV, Headphone, Monitor">
                        </div>

                        <!-- Item Title -->
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Title *</label>
                            <input type="text" id="itemTitle" class="form-control" placeholder="e.g. Samsung 32-Inch HD TV / Sony WH-1000XM5" required>
                        </div>

                        <!-- Price -->
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Price / Rate *</label>
                            <input type="text" id="itemPrice" class="form-control" placeholder="e.g. ₹18,705 or ₹69,999" required>
                        </div>

                        <!-- Image URL -->
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Image URL *</label>
                            <input type="url" id="itemImageUrl" class="form-control" placeholder="https://images.unsplash.com/..." required>
                        </div>

                        <!-- Duration / Spec Header -->
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Short Spec Tag / Subtitle</label>
                            <input type="text" id="itemDuration" class="form-control" placeholder="e.g. 15.6 Inch | 12GB RAM | 256GB SSD">
                        </div>

                        <!-- Dynamic Specific Specifications Section -->
                        <div class="col-12 mt-4">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <label class="form-label fw-bold text-primary mb-0"><i class="fa-solid fa-list-check me-1"></i> Technical Specifications (Model-Specific Fields)</label>
                                <button type="button" class="btn btn-sm btn-outline-primary" onclick="addSpecRow()"><i class="fa-solid fa-plus me-1"></i> Add Spec Field</button>
                            </div>
                            <small class="text-muted d-block mb-3">Laptop ke liye RAM/CPU, TV ke liye Screen/Resolution, Headphones ke liye Impedance/Color jaisi details yahan add karein.</small>
                            
                            <div id="specContainer" class="d-flex flex-column gap-2">
                                <!-- Dynamic Rows Will Be Injected Here -->
                            </div>
                        </div>

                        <!-- Highlights / Bullet Points (About this item) -->
                        <div class="col-12 mt-3">
                            <label class="form-label fw-semibold"><i class="fa-solid fa-circle-info text-info me-1"></i> About This Item (Bullet Points - 1 per line)</label>
                            <textarea id="itemHighlights" class="form-control" rows="3" placeholder="Enter key points (1 per line):&#10;• HIGH RESOLUTION: Crisp 1080p Visuals&#10;• NOISE CANCELLATION: Dual processor 8-mic system&#10;• BATTERY: Up to 30 Hours Playback"></textarea>
                        </div>

                        <!-- Full Description -->
                        <div class="col-12">
                            <label class="form-label fw-semibold">Full Description & Details</label>
                            <textarea id="itemDescription" class="form-control" rows="3" placeholder="Enter complete product summary, warranty details, inclusions..."></textarea>
                        </div>

                        <div class="col-12 d-flex gap-2 pt-2">
                            <button type="submit" id="saveBtn" class="btn btn-primary fw-bold px-4"><i class="fa-solid fa-floppy-disk me-1"></i> Save Product / Package</button>
                            <button type="button" id="cancelBtn" class="btn btn-secondary d-none" onclick="resetAdminForm()">Cancel Edit</button>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Category Wise Filter Tabs -->
            <div class="d-flex flex-wrap gap-2 mb-4 align-items-center bg-white p-3 rounded-4 shadow-sm">
                <span class="fw-bold text-muted me-2"><i class="fa-solid fa-filter me-1"></i> Filter Category:</span>
                <button class="btn btn-outline-primary category-tab-btn active" onclick="filterAdminItems('All', event)">All Items</button>
                <button class="btn btn-outline-primary category-tab-btn" onclick="filterAdminItems('Electronics', event)"><i class="fa-solid fa-laptop me-1"></i> Electronics</button>
                <button class="btn btn-outline-primary category-tab-btn" onclick="filterAdminItems('Mobile', event)"><i class="fa-solid fa-mobile me-1"></i> Mobile</button>
                <button class="btn btn-outline-primary category-tab-btn" onclick="filterAdminItems('Travel', event)"><i class="fa-solid fa-plane me-1"></i> Travel</button>
                <button class="btn btn-outline-primary category-tab-btn" onclick="filterAdminItems('Fashion', event)"><i class="fa-solid fa-shirt me-1"></i> Fashion</button>
                <button class="btn btn-outline-primary category-tab-btn" onclick="filterAdminItems('Service', event)"><i class="fa-solid fa-headset me-1"></i> Service</button>
                <button class="btn btn-outline-primary category-tab-btn" onclick="filterAdminItems('Home', event)"><i class="fa-solid fa-house me-1"></i> Home</button>
            </div>

            <!-- Dynamic Items Table -->
            <div class="card admin-card p-4 bg-white">
                <h4 class="fw-bold mb-3"><i class="fa-solid fa-list text-primary me-2"></i>Catalog Inventory</h4>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Image</th>
                                <th>Category</th>
                                <th>Title</th>
                                <th>Price</th>
                                <th>Short Specs</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="adminItemsTable">
                            <tr>
                                <td colspan="6" class="text-center py-4 text-muted">Loading catalog data...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    let allAdminItems = [];
    let currentFilter = 'All';

    // Helper: Add Dynamic Spec Row
    function addSpecRow(key = '', value = '') {
        const container = document.getElementById('specContainer');
        const rowId = 'spec_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
        
        const rowHtml = `
            <div class="row g-2 align-items-center spec-row" id="${rowId}">
                <div class="col-md-5">
                    <input type="text" class="form-control form-control-sm spec-key" placeholder="Key (e.g. Screen Size / RAM / Impedance)" value="${key}">
                </div>
                <div class="col-md-6">
                    <input type="text" class="form-control form-control-sm spec-value" placeholder="Value (e.g. 32 inches / 12 GB / 48 ohm)" value="${value}">
                </div>
                <div class="col-md-1 text-end">
                    <button type="button" class="btn btn-sm btn-outline-danger" onclick="document.getElementById('${rowId}').remove()"><i class="fa-solid fa-trash"></i></button>
                </div>
            </div>
        `;
        container.insertAdjacentHTML('beforeend', rowHtml);
    }

    // Auto Preset Specs on Category Select
    function handleCategoryChange() {
        const cat = document.getElementById('itemCategory').value;
        const container = document.getElementById('specContainer');
        if(container.children.length > 0) return; // Don't override if user already added fields

        if (cat === 'Electronics' || cat === 'Mobile') {
            addSpecRow('Brand', '');
            addSpecRow('Model Name', '');
            addSpecRow('Screen Size / Spec', '');
        } else if (cat === 'Travel') {
            addSpecRow('Duration', '');
            addSpecRow('Inclusions', '');
        }
    }

    // Collect Specs Object
    function getSpecsFromUI() {
        const specs = {};
        document.querySelectorAll('.spec-row').forEach(row => {
            const key = row.querySelector('.spec-key').value.trim();
            const val = row.querySelector('.spec-value').value.trim();
            if (key && val) {
                specs[key] = val;
            }
        });
        return specs;
    }

    // Load Items
    async function loadAdminItems() {
        try {
            const res = await fetch('/api/items');
            allAdminItems = await res.json();
            renderAdminTable(allAdminItems);
        } catch (err) {
            document.getElementById('adminItemsTable').innerHTML = `<tr><td colspan="6" class="text-center text-danger">Failed to fetch catalog items.</td></tr>`;
        }
    }

    // Render Table
    function renderAdminTable(items) {
        const tbody = document.getElementById('adminItemsTable');
        
        let filtered = items;
        if (currentFilter !== 'All') {
            filtered = items.filter(item => item.category.toLowerCase() === currentFilter.toLowerCase());
        }

        if (!filtered || filtered.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">No items found in Category: <strong>${currentFilter}</strong></td></tr>`;
            return;
        }

        tbody.innerHTML = filtered.map(item => `
            <tr>
                <td><img src="${item.imageUrl}" width="60" height="40" class="rounded object-fit-cover" onerror="this.src='https://via.placeholder.com/60x40';"></td>
                <td>
                    <span class="badge bg-primary px-3 py-2 rounded-pill">${item.category}</span>
                    ${item.subCategory ? `<br><small class="text-muted">${item.subCategory}</small>` : ''}
                </td>
                <td class="fw-bold text-dark">${item.title}</td>
                <td class="fw-semibold text-success">${item.price}</td>
                <td class="small text-muted">${item.duration || '-'}</td>
                <td>
                    <button class="btn btn-sm btn-outline-warning me-1" onclick="editItem('${item._id}')"><i class="fa-solid fa-pen"></i> Edit</button>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteItem('${item._id}')"><i class="fa-solid fa-trash"></i> Delete</button>
                </td>
            </tr>
        `).join('');
    }

    function filterAdminItems(cat, evt) {
        currentFilter = cat;
        document.querySelectorAll('.category-tab-btn').forEach(btn => btn.classList.remove('active'));
        if (evt) evt.target.classList.add('active');
        renderAdminTable(allAdminItems);
    }

    // Edit Item
    function editItem(id) {
        const item = allAdminItems.find(i => i._id === id);
        if (!item) return;

        document.getElementById('itemId').value = item._id;
        document.getElementById('itemCategory').value = item.category;
        document.getElementById('itemSubCategory').value = item.subCategory || '';
        document.getElementById('itemTitle').value = item.title;
        document.getElementById('itemPrice').value = item.price;
        document.getElementById('itemImageUrl').value = item.imageUrl;
        document.getElementById('itemDuration').value = item.duration || '';
        document.getElementById('itemHighlights').value = Array.isArray(item.highlights) ? item.highlights.join('\n') : (item.highlights || '');
        document.getElementById('itemDescription').value = item.description || '';

        // Load specs
        const container = document.getElementById('specContainer');
        container.innerHTML = '';
        if (item.specs && typeof item.specs === 'object') {
            Object.entries(item.specs).forEach(([k, v]) => addSpecRow(k, v));
        }

        document.getElementById('formTitle').innerHTML = `<i class="fa-solid fa-pen-to-square text-warning me-2"></i>Edit Product (${item.title})`;
        document.getElementById('cancelBtn').classList.remove('d-none');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetAdminForm() {
        document.getElementById('itemId').value = '';
        document.getElementById('itemForm').reset();
        document.getElementById('specContainer').innerHTML = '';
        document.getElementById('formTitle').innerHTML = `<i class="fa-solid fa-circle-plus text-success me-2"></i>Add New Product / Package`;
        document.getElementById('cancelBtn').classList.add('d-none');
    }

    // Save Item
    document.getElementById('itemForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const alertBox = document.getElementById('adminAlert');
        const id = document.getElementById('itemId').value;

        const highlightsRaw = document.getElementById('itemHighlights').value;
        const highlightsArray = highlightsRaw.split('\n').map(h => h.trim()).filter(h => h.length > 0);

        const payload = {
            category: document.getElementById('itemCategory').value,
            subCategory: document.getElementById('itemSubCategory').value,
            title: document.getElementById('itemTitle').value,
            price: document.getElementById('itemPrice').value,
            imageUrl: document.getElementById('itemImageUrl').value,
            duration: document.getElementById('itemDuration').value,
            specs: getSpecsFromUI(),
            highlights: highlightsArray,
            description: document.getElementById('itemDescription').value
        };

        const url = id ? `/api/items/${id}` : '/api/items';
        const method = id ? 'PUT' : 'POST';

        try {
            const res = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                alertBox.innerHTML = `<div class="alert alert-success">🎉 Product saved successfully with dynamic specifications!</div>`;
                resetAdminForm();
                loadAdminItems();
            } else {
                alertBox.innerHTML = `<div class="alert alert-danger">❌ Error saving product.</div>`;
            }
        } catch (err) {
            alertBox.innerHTML = `<div class="alert alert-danger">❌ Server connection error.</div>`;
        }
    });

    async function deleteItem(id) {
        if (!confirm("Are you sure you want to delete this product?")) return;

        try {
            const res = await fetch(`/api/items/${id}`, { method: 'DELETE' });
            if (res.ok) {
                loadAdminItems();
            }
        } catch (err) {
            alert("Failed to delete item.");
        }
    }

    loadAdminItems();
</script>
</body>
</html>
