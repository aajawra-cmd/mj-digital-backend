<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJ Digital Services & Packages</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .hero-section { background: linear-gradient(135deg, #0d6efd, #0dcaf0); color: white; padding: 60px 0; text-align: center; }
        .card { border: none; border-radius: 12px; transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important; }
        .card-img-top { height: 200px; object-fit: cover; border-top-left-radius: 12px; border-top-right-radius: 12px; background-color: #e9ecef; }
        .badge-category { position: absolute; top: 15px; right: 15px; font-size: 0.8rem; padding: 6px 12px; border-radius: 20px; }
        .contact-card { max-width: 650px; margin: auto; border-radius: 15px; }
    </style>
</head>
<body>

    <!-- Hero Header -->
    <header class="hero-section mb-5">
        <div class="container">
            <h1 class="fw-bold">Welcome to MJ Digital</h1>
            <p class="lead mb-0">Explore our Services, Products & Travel Packages</p>
        </div>
    </header>

    <div class="container mb-5">
        <!-- Products & Packages Catalog Section -->
        <section class="mb-5">
            <h2 class="text-center fw-bold mb-4">Our Featured Products & Packages</h2>
            <div id="dynamicItems" class="row g-4">
                <div class="text-center py-4">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2 text-muted">Loading items...</p>
                </div>
            </div>
        </section>

        <hr class="my-5">

        <!-- Contact / Lead Form Section -->
        <section>
            <div class="card contact-card shadow p-4 p-md-5">
                <h3 class="fw-bold text-center mb-2">Inquire / Contact Us</h3>
                <p class="text-muted text-center mb-4">Fill out the form below and we will get back to you shortly.</p>
                
                <div id="alertBox"></div>

                <form id="leadForm">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Full Name *</label>
                        <input type="text" id="name" class="form-control form-control-lg" required placeholder="e.g. Rahul Sharma">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email Address *</label>
                        <input type="email" id="email" class="form-control form-control-lg" required placeholder="e.g. rahul@example.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Phone Number *</label>
                        <input type="tel" id="phone" class="form-control form-control-lg" required placeholder="e.g. +91 9876543210">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Select Service / Interest *</label>
                        <select id="service" class="form-select form-select-lg" required>
                            <option value="" selected disabled>-- Choose Option --</option>
                            <option value="Digital Marketing">Digital Marketing</option>
                            <option value="Travel Booking">Travel Booking</option>
                            <option value="E-commerce Product">E-commerce Product</option>
                            <option value="Other Query">Other Query</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Your Message / Requirement</label>
                        <textarea id="message" class="form-control" rows="3" placeholder="Tell us more about your inquiry..."></textarea>
                    </div>
                    <button type="submit" id="submitBtn" class="btn btn-primary btn-lg w-100 fw-bold">Submit Inquiry</button>
                </form>
            </div>
        </section>
    </div>

    <!-- JavaScript Handling -->
    <script>
        // 1. Dynamic Catalog Load
        async function fetchCatalog() {
            const container = document.getElementById('dynamicItems');
            try {
                const res = await fetch('/api/items');
                const items = await res.json();
                
                if (!items || items.length === 0) {
                    container.innerHTML = `<div class="col-12 text-center text-muted py-4"><p>No products or packages added yet. Add them from Admin Panel!</p></div>`;
                    return;
                }

                container.innerHTML = items.map(item => `
                    <div class="col-md-4">
                        <div class="card h-100 shadow-sm position-relative">
                            <span class="badge ${item.category === 'Package' ? 'bg-success' : 'bg-primary'} badge-category">${item.category}</span>
                            <img src="${item.imageUrl}" class="card-img-top" alt="${item.title}" onerror="this.src='https://via.placeholder.com/300x200?text=No+Image';">
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title fw-bold text-dark mb-2">${item.title}</h5>
                                <p class="card-text text-muted small mb-3 flex-grow-1">${item.description || 'No description available.'}</p>
                                ${item.duration ? `<p class="small text-primary fw-semibold mb-2">⏱️ ${item.duration}</p>` : ''}
                                <div class="d-flex justify-content-between align-items-center mt-auto pt-2 border-top">
                                    <span class="fs-5 fw-bold text-dark">${item.price}</span>
                                    <a href="#leadForm" onclick="preselectService('${item.title}')" class="btn btn-outline-primary btn-sm rounded-pill px-3">Book Now</a>
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                container.innerHTML = `<div class="col-12 text-center text-danger py-4"><p>Failed to load catalog.</p></div>`;
            }
        }

        function preselectService(title) {
            document.getElementById('message').value = `Interested in: ${title}`;
        }

        // 2. Submit Lead Form Handling
        document.getElementById('leadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const alertBox = document.getElementById('alertBox');
            
            submitBtn.disabled = true;
            submitBtn.innerText = 'Submitting...';

            const payload = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                service: document.getElementById('service').value,
                message: document.getElementById('message').value
            };

            try {
                const res = await fetch('/api/leads/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (data.success) {
                    alertBox.innerHTML = `<div class="alert alert-success">🎉 Inquiry submitted successfully! Confirmation email has been sent.</div>`;
                    document.getElementById('leadForm').reset();
                } else {
                    alertBox.innerHTML = `<div class="alert alert-danger">❌ Error: ${data.message}</div>`;
                }
            } catch (err) {
                alertBox.innerHTML = `<div class="alert alert-danger">❌ Something went wrong. Please try again.</div>`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Submit Inquiry';
            }
        });

        // Initialize Catalog on Page Load
        fetchCatalog();
    </script>
</body>
</html>
