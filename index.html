<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJ Digital - Product Details & Shopping Cart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .variant-btn { border: 2px solid #e2e8f0; background: #fff; border-radius: 8px; padding: 8px 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .variant-btn:hover, .variant-btn.active { border-color: #4f46e5; background: #eef2ff; color: #4f46e5; }
        .color-badge { width: 32px; height: 32px; border-radius: 50%; display: inline-block; border: 2px solid #ddd; cursor: pointer; }
        .color-badge.active { border-color: #4f46e5; transform: scale(1.1); }
        .cart-badge { position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; border-radius: 50%; padding: 2px 6px; font-size: 11px; }
    </style>
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="/"><i class="fa-solid fa-bolt me-2"></i>MJ DIGITAL</a>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-danger position-relative rounded-pill px-3" onclick="openWishlistModal()">
                <i class="fa-solid fa-heart me-1"></i> Wishlist <span id="wishlistCount" class="badge bg-danger">0</span>
            </button>
            <button class="btn btn-outline-primary position-relative rounded-pill px-3" onclick="openCartModal()">
                <i class="fa-solid fa-cart-shopping me-1"></i> Cart <span id="cartCount" class="badge bg-primary">0</span>
            </button>
        </div>
    </div>
</nav>

<!-- Main Product View Section -->
<div class="container py-5">
    <div class="row g-4 bg-white p-4 rounded-4 shadow-sm" id="productDetailContainer">
        <!-- Dynamic Product Content loaded via JS -->
    </div>
</div>

<!-- Wishlist Modal -->
<div class="modal fade" id="wishlistModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold"><i class="fa-solid fa-heart text-danger me-2"></i>Your Wishlist</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="wishlistItemsContainer">
                <!-- Wishlist items injected here -->
            </div>
        </div>
    </div>
</div>

<!-- Cart Modal -->
<div class="modal fade" id="cartModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold"><i class="fa-solid fa-cart-shopping text-primary me-2"></i>Your Shopping Cart</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="cartItemsContainer">
                <!-- Cart items injected here -->
            </div>
            <div class="modal-footer d-flex justify-content-between">
                <h5 class="fw-bold mb-0">Total: <span id="cartTotal" class="text-success">₹0</span></h5>
                <button class="btn btn-success fw-bold px-4" onclick="checkout()"><i class="fa-solid fa-check me-1"></i> Checkout Now</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let currentProduct = null;
    let selectedVariant = null;
    let selectedColor = null;

    let cart = JSON.parse(localStorage.getItem('mj_cart')) || [];
    let wishlist = JSON.parse(localStorage.getItem('mj_wishlist')) || [];

    // Render Product Details & Variant Selectors
    function renderProductView(product) {
        currentProduct = product;
        selectedVariant = product.variants && product.variants.length > 0 ? product.variants[0] : null;
        selectedColor = product.colors && product.colors.length > 0 ? product.colors[0] : null;

        const container = document.getElementById('productDetailContainer');
        container.innerHTML = `
            <div class="col-md-5 text-center">
                <img id="mainProductImg" src="${selectedColor && selectedColor.imageUrl ? selectedColor.imageUrl : product.imageUrl}" class="img-fluid rounded-3 object-fit-cover shadow-sm" style="max-height: 400px;">
            </div>
            <div class="col-md-7">
                <span class="badge bg-primary mb-2">${product.category}</span>
                <h2 class="fw-bold">${product.title}</h2>
                <h3 class="fw-bold text-success my-3" id="displayPrice">${selectedVariant ? selectedVariant.price : product.price}</h3>

                <!-- Storage / Size Variant Selection -->
                ${product.variants && product.variants.length > 0 ? `
                    <div class="mb-3">
                        <label class="fw-bold d-block mb-2">Select Edition / Storage / Size:</label>
                        <div class="d-flex flex-wrap gap-2">
                            ${product.variants.map((v, idx) => `
                                <button class="variant-btn ${idx === 0 ? 'active' : ''}" onclick="selectVariant('${v.label}', '${v.price}', this)">
                                    ${v.label}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                ` : ''}

                <!-- Color Selection -->
                ${product.colors && product.colors.length > 0 ? `
                    <div class="mb-3">
                        <label class="fw-bold d-block mb-2">Select Color:</label>
                        <div class="d-flex gap-2">
                            ${product.colors.map((c, idx) => `
                                <button class="btn btn-outline-secondary btn-sm ${idx === 0 ? 'active' : ''}" onclick="selectColor('${c.color}', '${c.imageUrl}', this)">
                                    ${c.color}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                ` : ''}

                <div class="d-flex gap-3 mt-4">
                    <button class="btn btn-primary btn-lg fw-bold flex-grow-1" onclick="addToCart()">
                        <i class="fa-solid fa-cart-plus me-1"></i> Add to Cart
                    </button>
                    <button class="btn btn-outline-danger btn-lg fw-bold" onclick="toggleWishlist()">
                        <i class="fa-solid fa-heart me-1"></i> Wishlist
                    </button>
                </div>
            </div>
        `;
    }

    // Select Variant Event
    function selectVariant(label, price, btn) {
        selectedVariant = { label, price };
        document.getElementById('displayPrice').innerText = price;
        document.querySelectorAll('.variant-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    // Select Color Event
    function selectColor(color, imgUrl, btn) {
        selectedColor = { color, imageUrl: imgUrl };
        if(imgUrl) document.getElementById('mainProductImg').src = imgUrl;
    }

    // Cart Management
    function addToCart() {
        const item = {
            id: currentProduct._id,
            title: currentProduct.title,
            variant: selectedVariant ? selectedVariant.label : 'Standard',
            price: selectedVariant ? selectedVariant.price : currentProduct.price,
            color: selectedColor ? selectedColor.color : '',
            image: currentProduct.imageUrl
        };
        cart.push(item);
        localStorage.setItem('mj_cart', JSON.stringify(cart));
        updateCounters();
        alert(`✅ Added ${item.title} (${item.variant}) to Cart!`);
    }

    // Wishlist Management
    function toggleWishlist() {
        const index = wishlist.findIndex(w => w.id === currentProduct._id);
        if (index === -1) {
            wishlist.push({
                id: currentProduct._id,
                title: currentProduct.title,
                price: currentProduct.price,
                image: currentProduct.imageUrl
            });
            alert('❤️ Added to Wishlist!');
        } else {
            wishlist.splice(index, 1);
            alert('Removed from Wishlist');
        }
        localStorage.setItem('mj_wishlist', JSON.stringify(wishlist));
        updateCounters();
    }

    function removeFromWishlist(id) {
        wishlist = wishlist.filter(w => w.id !== id);
        localStorage.setItem('mj_wishlist', JSON.stringify(wishlist));
        updateCounters();
        renderWishlistModal();
    }

    function moveWishlistToCart(id) {
        const item = wishlist.find(w => w.id === id);
        if (item) {
            cart.push({
                id: item.id,
                title: item.title,
                variant: 'Standard',
                price: item.price,
                image: item.image
            });
            wishlist = wishlist.filter(w => w.id !== id);
            localStorage.setItem('mj_cart', JSON.stringify(cart));
            localStorage.setItem('mj_wishlist', JSON.stringify(wishlist));
            updateCounters();
            renderWishlistModal();
            alert('🛒 Moved item to Cart!');
        }
    }

    function updateCounters() {
        document.getElementById('cartCount').innerText = cart.length;
        document.getElementById('wishlistCount').innerText = wishlist.length;
    }

    // Modal Rendering
    function openWishlistModal() {
        renderWishlistModal();
        new bootstrap.Modal(document.getElementById('wishlistModal')).show();
    }

    function renderWishlistModal() {
        const container = document.getElementById('wishlistItemsContainer');
        if (wishlist.length === 0) {
            container.innerHTML = `<p class="text-center text-muted py-4">Your Wishlist is empty.</p>`;
            return;
        }

        container.innerHTML = wishlist.map(item => `
            <div class="d-flex align-items-center justify-content-between border-bottom py-2">
                <div class="d-flex align-items-center gap-3">
                    <img src="${item.image}" width="50" height="50" class="rounded object-fit-cover">
                    <div>
                        <h6 class="mb-0 fw-bold">${item.title}</h6>
                        <small class="text-success fw-bold">${item.price}</small>
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-sm btn-primary" onclick="moveWishlistToCart('${item.id}')"><i class="fa-solid fa-cart-shopping"></i> Buy Now / Cart</button>
                    <button class="btn btn-sm btn-outline-danger" onclick="removeFromWishlist('${item.id}')"><i class="fa-solid fa-trash"></i></button>
                </div>
            </div>
        `).join('');
    }

    function openCartModal() {
        renderCartModal();
        new bootstrap.Modal(document.getElementById('cartModal')).show();
    }

    function renderCartModal() {
        const container = document.getElementById('cartItemsContainer');
        if (cart.length === 0) {
            container.innerHTML = `<p class="text-center text-muted py-4">Your Cart is empty.</p>`;
            return;
        }

        container.innerHTML = cart.map((item, idx) => `
            <div class="d-flex align-items-center justify-content-between border-bottom py-2">
                <div class="d-flex align-items-center gap-3">
                    <img src="${item.image}" width="50" height="50" class="rounded object-fit-cover">
                    <div>
                        <h6 class="mb-0 fw-bold">${item.title}</h6>
                        <small class="badge bg-light text-dark border">${item.variant}</small>
                        <small class="text-success fw-bold ms-2">${item.price}</small>
                    </div>
                </div>
                <button class="btn btn-sm btn-outline-danger" onclick="removeFromCart(${idx})"><i class="fa-solid fa-trash"></i></button>
            </div>
        `).join('');
    }

    function removeFromCart(index) {
        cart.splice(index, 1);
        localStorage.setItem('mj_cart', JSON.stringify(cart));
        updateCounters();
        renderCartModal();
    }

    updateCounters();
</script>
</body>
</html>
