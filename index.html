<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJ DIGITAL - Modern E-Commerce</title>
    <!-- Bootstrap 5 & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8fafc; font-family: sans-serif; }
        .variant-btn { border: 2px solid #cbd5e1; background: #fff; border-radius: 8px; padding: 6px 16px; font-weight: 600; cursor: pointer; }
        .variant-btn.active { border-color: #0d6efd; background: #e7f1ff; color: #0d6efd; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary fs-3" href="#"><i class="fa-solid fa-bolt"></i> MJ DIGITAL</a>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-danger rounded-pill" onclick="showWishlistModal()">
                <i class="fa-solid fa-heart"></i> Wishlist (<span id="wishCount">0</span>)
            </button>
            <button class="btn btn-primary rounded-pill" onclick="showCartModal()">
                <i class="fa-solid fa-cart-shopping"></i> Cart (<span id="cartCount">0</span>)
            </button>
        </div>
    </div>
</nav>

<!-- Main Container -->
<div class="container py-5">
    <div id="productCard" class="bg-white p-4 rounded-4 shadow-sm">
        <div class="row g-4">
            <!-- Product Image -->
            <div class="col-md-5 text-center">
                <img id="productImage" src="https://images.unsplash.com/photo-1695048133142-1a20484d2569?w=600" class="img-fluid rounded-3" style="max-height: 400px; object-fit: contain;">
            </div>
            <!-- Product Details -->
            <div class="col-md-7">
                <span class="badge bg-secondary mb-2">Mobile</span>
                <h1 id="productTitle" class="fw-bold">iPhone 17 Pro</h1>
                <p class="text-muted mb-2">Overview & Description: ERGO|OPWSRG</p>
                
                <h2 class="fw-bold text-primary my-3">₹ <span id="productPrice">149999</span></h2>

                <!-- Storage / Variant Buttons (256GB vs 128GB Issue Fixed) -->
                <div class="mb-4">
                    <label class="fw-bold d-block mb-2">Select Storage / Variant:</label>
                    <div class="d-flex gap-2">
                        <button class="variant-btn" onclick="selectVariant('128GB', 139999, this)">128 GB</button>
                        <button class="variant-btn active" onclick="selectVariant('256GB', 149999, this)">256 GB</button>
                        <button class="variant-btn" onclick="selectVariant('512GB', 169999, this)">512 GB</button>
                    </div>
                </div>

                <!-- Form Fields -->
                <div class="border p-3 rounded-3 mb-3 bg-light">
                    <h5 class="fw-bold mb-3"><i class="fa-regular fa-calendar-check text-primary"></i> Complete Booking / Order Request</h5>
                    <div class="row g-2">
                        <div class="col-md-6"><input type="text" id="custName" class="form-control" placeholder="Your Full Name *"></div>
                        <div class="col-md-6"><input type="text" id="custPhone" class="form-control" placeholder="Phone Number *"></div>
                        <div class="col-12 mt-2"><input type="email" id="custEmail" class="form-control" placeholder="Email Address *"></div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="d-flex gap-3">
                    <button class="btn btn-primary btn-lg fw-bold flex-grow-1" onclick="handleAddToCart()">
                        <i class="fa-solid fa-cart-plus me-1"></i> Add to Cart
                    </button>
                    <button class="btn btn-outline-danger btn-lg fw-bold" onclick="handleAddToWishlist()">
                        <i class="fa-solid fa-heart me-1"></i> Add to Wishlist
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal Dialogs -->
<div class="modal fade" id="infoModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="modalTitle">Wishlist / Cart</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let selectedStorage = "256GB";
    let selectedPrice = 149999;

    let cartList = [];
    let wishList = [];

    function selectVariant(storage, price, btn) {
        selectedStorage = storage;
        selectedPrice = price;
        document.getElementById('productPrice').innerText = price;

        document.querySelectorAll('.variant-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function handleAddToCart() {
        const item = {
            title: document.getElementById('productTitle').innerText,
            storage: selectedStorage,
            price: selectedPrice
        };
        cartList.push(item);
        document.getElementById('cartCount').innerText = cartList.length;
        alert(`✅ ${item.title} (${item.storage}) added to Cart!`);
    }

    function handleAddToWishlist() {
        const item = {
            title: document.getElementById('productTitle').innerText,
            storage: selectedStorage,
            price: selectedPrice
        };
        wishList.push(item);
        document.getElementById('wishCount').innerText = wishList.length;
        alert(`❤️ Added to Wishlist!`);
    }

    function showCartModal() {
        document.getElementById('modalTitle').innerText = "Shopping Cart";
        const container = document.getElementById('modalBody');
        if(cartList.length === 0) {
            container.innerHTML = "<p class='text-center text-muted'>Cart is empty</p>";
        } else {
            container.innerHTML = cartList.map((item, idx) => `
                <div class="d-flex justify-content-between align-items-center border-bottom py-2">
                    <div>
                        <strong>${item.title} (${item.storage})</strong><br>
                        <span class="text-success fw-bold">₹${item.price}</span>
                    </div>
                    <button class="btn btn-sm btn-danger" onclick="removeCart(${idx})"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('');
        }
        new bootstrap.Modal(document.getElementById('infoModal')).show();
    }

    function showWishlistModal() {
        document.getElementById('modalTitle').innerText = "Your Wishlist";
        const container = document.getElementById('modalBody');
        if(wishList.length === 0) {
            container.innerHTML = "<p class='text-center text-muted'>Wishlist is empty</p>";
        } else {
            container.innerHTML = wishList.map((item, idx) => `
                <div class="d-flex justify-content-between align-items-center border-bottom py-2">
                    <div>
                        <strong>${item.title} (${item.storage})</strong><br>
                        <span class="text-success fw-bold">₹${item.price}</span>
                    </div>
                    <div>
                        <button class="btn btn-sm btn-success me-1" onclick="moveWishToCart(${idx})"><i class="fa-solid fa-cart-plus"></i> Buy Now</button>
                        <button class="btn btn-sm btn-danger" onclick="removeWish(${idx})"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }
        new bootstrap.Modal(document.getElementById('infoModal')).show();
    }

    function removeCart(idx) {
        cartList.splice(idx, 1);
        document.getElementById('cartCount').innerText = cartList.length;
        showCartModal();
    }

    function removeWish(idx) {
        wishList.splice(idx, 1);
        document.getElementById('wishCount').innerText = wishList.length;
        showWishlistModal();
    }

    function moveWishToCart(idx) {
        cartList.push(wishList[idx]);
        wishList.splice(idx, 1);
        document.getElementById('cartCount').innerText = cartList.length;
        document.getElementById('wishCount').innerText = wishList.length;
        showCartModal();
    }
</script>
</body>
</html>
