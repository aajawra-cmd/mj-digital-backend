<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Capture & Contact Us</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7fe; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; }
        
        /* Form Card Styling */
        .card { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 30px; }
        h2 { margin-bottom: 20px; color: #002b5b; font-size: 24px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; transition: 0.3s; }
        input:focus, select:focus, textarea:focus { border-color: #002b5b; outline: none; box-shadow: 0 0 5px rgba(0, 43, 91, 0.2); }
        
        button { background-color: #002b5b; color: white; border: none; padding: 12px 20px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; transition: background 0.3s; }
        button:hover { background-color: #001f42; }
        button:disabled { background-color: #a0a0a0; cursor: not-allowed; }

        /* Notification Alert */
        .alert { padding: 12px; border-radius: 6px; margin-bottom: 15px; display: none; font-size: 14px; }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        /* Table Styling */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #e0e0e0; padding: 12px; text-align: left; font-size: 14px; }
        th { background-color: #002b5b; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
    </style>
</head>
<body>

<div class="container">

    <!-- 1. LEAD CAPTURE FORM -->
    <div class="card">
        <h2>Inquire / Contact Us</h2>
        
        <!-- Success/Error Message -->
        <div id="alertBox" class="alert"></div>

        <form id="leadForm">
            <div class="form-group">
                <label for="name">Full Name *</label>
                <input type="text" id="name" placeholder="Rahul Sharma" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" placeholder="rahul@example.com" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number *</label>
                <input type="tel" id="phone" placeholder="9876543210" required>
            </div>

            <div class="form-group">
                <label for="service">Select Service *</label>
                <select id="service" required>
                    <option value="">-- Choose Option --</option>
                    <option value="Web Development">Web Development</option>
                    <option value="Digital Marketing">Digital Marketing</option>
                    <option value="Travel Package">Travel Booking</option>
                    <option value="Other Inquiry">Other Inquiry</option>
                </select>
            </div>

            <div class="form-group">
                <label for="message">Your Message / Requirement</label>
                <textarea id="message" rows="4" placeholder="Tell us more about your inquiry..."></textarea>
            </div>

            <button type="submit" id="submitBtn">Submit Request</button>
        </form>
    </div>

    <!-- 2. ADMIN VIEW (ALL LEADS DISPLAY TABLE) -->
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>Captured Leads (Admin View)</h2>
            <button onclick="fetchLeads()" style="width: auto; padding: 8px 15px;">Refresh Leads</button>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Service</th>
                    <th>Message</th>
                </tr>
            </thead>
            <tbody id="leadsTableBody">
                <tr>
                    <td colspan="6" style="text-align: center;">Loading leads...</td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

<script>
    const leadForm = document.getElementById('leadForm');
    const submitBtn = document.getElementById('submitBtn');
    const alertBox = document.getElementById('alertBox');

    // A. Form Submit Event Handler
    leadForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        // UI Loading State
        submitBtn.disabled = true;
        submitBtn.innerText = 'Submitting & Sending Emails...';
        alertBox.style.display = 'none';

        // Collect Form Data
        const formData = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            service: document.getElementById('service').value,
            message: document.getElementById('message').value
        };

        try {
            // Send data to backend Node.js API
            const response = await fetch('/api/leads/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });

            const result = await response.json();

            if (result.success) {
                showAlert('success', '🎉 Inquiry submitted successfully! Confirmation email has been sent.');
                leadForm.reset();
                fetchLeads(); // Refresh table view
            } else {
                showAlert('error', '❌ Error: ' + result.message);
            }
        } catch (error) {
            showAlert('error', '❌ Could not connect to server. Ensure Node.js server is running.');
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = 'Submit Request';
        }
    });

    // B. Show Alert Notification
    function showAlert(type, message) {
        alertBox.className = `alert alert-${type === 'success' ? 'success' : 'error'}`;
        alertBox.innerText = message;
        alertBox.style.display = 'block';
    }

    // C. Fetch & Display Leads in Table
    async function fetchLeads() {
        const tbody = document.getElementById('leadsTableBody');
        try {
            const response = await fetch('/api/leads');
            const leads = await response.json();

            if (leads.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No leads found yet.</td></tr>';
                return;
            }

            tbody.innerHTML = leads.map(lead => `
                <tr>
                    <td>${new Date(lead.createdAt).toLocaleDateString()}</td>
                    <td><strong>${lead.name}</strong></td>
                    <td>${lead.email}</td>
                    <td>${lead.phone}</td>
                    <td>${lead.service}</td>
                    <td>${lead.message || '-'}</td>
                </tr>
            `).join('');
        } catch (err) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:red;">Failed to load leads from database.</td></tr>';
        }
    }

    // Page Load hote hi leads load karein
    fetchLeads();
</script>

</body>
</html>
