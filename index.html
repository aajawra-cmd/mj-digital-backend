<!-- Products & Packages Container -->
<div class="container py-5">
    <h2 class="text-center mb-4">Our Products & Tour Packages</h2>
    <div id="dynamicItems" class="row g-4"></div>
</div>

<script>
    async function fetchCatalog() {
        const res = await fetch('/api/items');
        const items = await res.json();
        const container = document.getElementById('dynamicItems');
        if (items.length === 0) {
            container.innerHTML = '<p class="text-center text-muted">No items available right now.</p>';
            return;
        }
        container.innerHTML = items.map(item => `
            <div class="col-md-4">
                <div class="card h-100 shadow-sm">
                    <img src="${item.imageUrl}" class="card-img-top" style="height:200px; object-fit:cover;">
                    <div class="card-body">
                        <span class="badge bg-secondary mb-2">${item.category}</span>
                        <h5 class="card-title">${item.title}</h5>
                        <p class="card-text text-muted">${item.description || ''}</p>
                        ${item.duration ? `<p class="small text-primary mb-1">⏱️ ${item.duration}</p>` : ''}
                        <h6 class="text-dark fw-bold">${item.price}</h6>
                    </div>
                </div>
            </div>
        `).join('');
    }
    fetchCatalog();
</script>
