<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJ Digital - E-Commerce Store</title>
    <!-- FontAwesome & Bootstrap 5 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .product-card { border: none; border-radius: 12px; transition: transform 0.2s, box-shadow 0.2s; }
        .product-card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.08); }
        .variant-btn { border: 2px solid #e2e8f0; background: #fff; border-radius: 8px; padding: 6px 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .variant-btn:hover, .variant-btn.active { border-color: #4f46e5; background: #eef2ff; color: #4f46e5; }
        .color-badge-btn { border: 2px solid #e2e8f0; background: #fff; border-radius: 20px; padding: 4px 12px; font-size: 13px; font-weight: 600; }
        .color-badge-btn.active { border-color: #10b981; background: #ecfdf5; color: #047857; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="/"><i class="fa-solid fa-bolt me-2"></i>MJ DIGITAL</a>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-danger position-relative rounded-pill px-3" onclick="openWishlistModal()">
                <i class="fa-solid fa-heart me-1"></i> Wishlist <span id="wishlistCount" class="badge bg-danger">0</span>
            </button>
            <button class="btn btn-primary position-relative rounded-pill px-3" onclick="openCartModal()">
                <i class="fa-solid fa-cart-shopping me-1"></i> Cart <span id="cartCount" class="badge bg-light text-dark">0</span>
            </button>
            <a href="/admin.html" target="_blank" class="btn btn-dark rounded-pill px-3"><i class="fa-solid fa-user-gear me-1"></i> Admin</a>
        </div>
    </div>
</nav>

<!-- Container for Main Content -->
<div class="container py-4" id="mainContainer">
    <div class="text-center py-5" id="loadingSpinner">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 text-muted">Loading Store Products...</p>
    </div>
    
    <!-- Products Grid -->
    <div class="row g-4 d-none" id="productsGrid"></div>
</div>

<!-- Wishlist Modal -->
<div class="modal fade" id="wishlistModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold"><i class="fa-solid fa-heart text-danger me-2"></i>Your Wishlist</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="wishlistItemsContainer"></div>
        </div>
    </div>
</div>

<!-- Cart Modal -->
<div class="modal fade" id="cartModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold"><i class="fa-solid fa-cart-shopping text-primary me-2"></i>Your Shopping Cart</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="cartItemsContainer"></div>
            <div class="modal-footer d-flex justify-content-between">
                <h5 class="fw-bold mb-0">Total Items: <span id="cartTotalItems" class="text-primary">0</span></h5>
                <button class="btn btn-success fw-bold px-4" onclick="checkout()"><i class="fa-solid fa-check me-1"></i> Proceed to Order</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let storeProducts = [];
    let cart = JSON.parse(localStorage.getItem('mj_cart')) || [];
    let wishlist = JSON.parse(localStorage.getItem('mj_wishlist')) || [];

    // Track selections per product
    let selectedState = {};

    async function loadProducts() {
        try {
            const res = await fetch('/api/items');
            storeProducts = await res.json();
            
            document.getElementById('loadingSpinner').classList.add('d-none');
            
            if (!storeProducts || storeProducts.length === 0) {
                document.getElementById('mainContainer').innerHTML = `
                    <div class="alert alert-warning text-center">
                        <h5>No Products Found!</h5>
                        <p>Please add products from the <a href="/admin.html">Admin Panel</a>.</p>
                    </div>`;
                return;
            }

            renderProductsGrid();
        } catch (err) {
            document.getElementById('loadingSpinner').classList.add('d-none');
            document.getElementById('mainContainer').innerHTML = `
                <div class="alert alert-danger text-center">
                    <h5>Failed to load store data.</h5>
                    <p>Make sure backend server is running properly.</p>
                </div>`;
        }
    }

    function renderProductsGrid() {
        const grid = document.getElementById('productsGrid');
        grid.classList.remove('d-none');
        
        grid.innerHTML = storeProducts.map(product => {
            // Initialize defaults
            if (!selectedState[product._id]) {
                selectedState[product._id] = {
                    variant: (product.variants && product.variants.length > 0) ? product.variants[0] : { label: 'Standard', price: product.price },
                    color: (product.colors && product.colors.length > 0) ? product.colors[0] : null,

                    image: product.imageUrl
                };
            }

            const state = selectedState[product._id];

            return `
            <div class="col-12 col-md-6 col-lg-6 mb-4">
                <div class="card product-card p-4 bg-white shadow-sm h-100">
                    <div class="row g-3">
                        <div class="col-md-5 text-center">
                            <img id="img_${product._id}" src="${state.image}" class="img-fluid rounded object-fit-cover shadow-sm" style="max-height: 240px; width: 100%;">
                        </div>
                        <div class="col-md-7 d-flex flex-column justify-content-between">
                            <div>
                                <span class="badge bg-primary mb-1">${product.category}</span>
                                <h4 class="fw-bold mb-1">${product.title}</h4>
                                <small class="text-muted d-block mb-2">${product.duration || ''}</small>
                                <h4 class="fw-bold text-success mb-3" id="price_${product._id}">${state.variant.price || product.price}</h4>

                                <!-- Variant Selector (Storage / Size) -->
                                ${product.variants && product.variants.length > 0 ? `
                                    <div class="mb-3">
                                        <small class="fw-bold text-muted d-block mb-1">Select Storage / Option:</small>
                                        <div class="d-flex flex-wrap gap-2">
                                            ${product.variants.map((v, idx) => `
                                                <button class="variant-btn ${state.variant.label === v.label ? 'active' : ''}" 
                                                        onclick="updateVariant('${product._id}', '${v.label}', '${v.price}', this)">
                                                    ${v.label}
                                                </button>
                                            `).join('')}
                                        </div>
                                    </div>
                                ` : ''}

                                <!-- Color Options -->
                                ${product.colors && product.colors.length > 0 ? `
                                    <div class="mb-3">
                                        <small class="fw-bold text-muted d-block mb-1">Select Color:</small>
                                        <div class="d-flex flex-wrap gap-2">
                                            ${product.colors.map((c) => `
                                                <button class="color-badge-btn ${state.color && state.color.color === c.color ? 'active' : ''}" 
                                                        onclick="updateColor('${product._id}', '${c.color}', '${c.imageUrl}', this)">
                                                    ${c.color}
                                                </button>
                                            `).join('')}
                                        </div>
                                    </div>
                                ` : ''}
                            </div>

                            <!-- Action Buttons -->
                            <div class="d-flex gap-2 mt-3">
                                <button class="btn btn-primary fw-bold flex-grow-1" onclick="addToCart('${product._id}')">
                                    <i class="fa-solid fa-cart-plus me-1"></i> Add to Cart
                                </button>
                                <button class="btn btn-outline-danger" onclick="toggleWishlist('${product._id}')">
                                    <i class="fa-solid fa-heart"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            `;
        }).join('');
    }

    function updateVariant(productId, label, price, btnElement) {
        selectedState[productId].variant = { label, price };
        document.getElementById(`price_${productId}`).innerText = price;
        
        const parent = btnElement.parentElement;
        parent.querySelectorAll('.variant-btn').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');
    }

    function updateColor(productId, colorName, imgUrl, btnElement) {
        selectedState[productId].color = { color: colorName, imageUrl: imgUrl };
        if (imgUrl && imgUrl.trim() !== '') {
            selectedState[productId].image = imgUrl;
            document.getElementById(`img_${productId}`).src = imgUrl;
        }

        const parent = btnElement.parentElement;
        parent.querySelectorAll('.color-badge-btn').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');
    }

    // Add to Cart
    function addToCart(productId) {
        const product = storeProducts.find(p => p._id === productId);
        const state = selectedState[productId];

        const item = {
            id: product._id,
            title: product.title,
            variant: state.variant ? state.variant.label : 'Standard',
            price: state.variant ? state.variant.price : product.price,
            color: state.color ? state.color.color : 'Default',
            image: state.image
        };

        cart.push(item);
        localStorage.setItem('mj_cart', JSON.stringify(cart));
        updateCounters();
        alert(`🎉 Added "${item.title} (${item.variant})" to Cart!`);
    }

    // Wishlist Logic
    function toggleWishlist(productId) {
        const product = storeProducts.find(p => p._id === productId);
        const state = selectedState[productId];

        const index = wishlist.findIndex(w => w.id === productId);
        if (index === -1) {
            wishlist.push({
                id: product._id,
                title: product.title,
                price: state.variant ? state.variant.price : product.price,
                image: state.image
            });
            alert('❤️ Added to Wishlist!');
        } else {
            wishlist.splice(index, 1);
            alert('Removed from Wishlist');
        }
        localStorage.setItem('mj_wishlist', JSON.stringify(wishlist));
        updateCounters();
    }

    function removeFromWishlist(id) {
        wishlist = wishlist.filter(w => w.id !== id);
        localStorage.setItem('mj_wishlist', JSON.stringify(wishlist));
        updateCounters();
        renderWishlistModal();
    }

    function moveWishlistToCart(id) {
        const item = wishlist.find(w => w.id === id);
        if (item) {
            cart.push({
                id: item.id,
                title: item.title,
                variant: 'Selected Edition',
                price: item.price,
                image: item.image
            });
            wishlist = wishlist.filter(w => w.id !== id);
            localStorage.setItem('mj_cart', JSON.stringify(cart));
            localStorage.setItem('mj_wishlist', JSON.stringify(wishlist));
            updateCounters();
            renderWishlistModal();
            alert('🛒 Item moved to Cart successfully!');
        }
    }

    function removeFromCart(index) {
        cart.splice(index, 1);
        localStorage.setItem('mj_cart', JSON.stringify(cart));
        updateCounters();
        renderCartModal();
    }

    function updateCounters() {
        document.getElementById('cartCount').innerText = cart.length;
        document.getElementById('wishlistCount').innerText = wishlist.length;
    }

    function openWishlistModal() {
        renderWishlistModal();
        new bootstrap.Modal(document.getElementById('wishlistModal')).show();
    }

    function renderWishlistModal() {
        const container = document.getElementById('wishlistItemsContainer');
        if (wishlist.length === 0) {
            container.innerHTML = `<p class="text-center text-muted py-4">Your Wishlist is empty.</p>`;
            return;
        }

        container.innerHTML = wishlist.map(item => `
            <div class="d-flex align-items-center justify-content-between border-bottom py-2">
                <div class="d-flex align-items-center gap-3">
                    <img src="${item.image}" width="50" height="50" class="rounded object-fit-cover">
                    <div>
                        <h6 class="mb-0 fw-bold">${item.title}</h6>
                        <small class="text-success fw-bold">${item.price}</small>
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-sm btn-primary" onclick="moveWishlistToCart('${item.id}')"><i class="fa-solid fa-cart-shopping me-1"></i> Buy / Move to Cart</button>
                    <button class="btn btn-sm btn-outline-danger" onclick="removeFromWishlist('${item.id}')"><i class="fa-solid fa-trash"></i></button>
                </div>
            </div>
        `).join('');
    }

    function openCartModal() {
        renderCartModal();
        new bootstrap.Modal(document.getElementById('cartModal')).show();
    }

    function renderCartModal() {
        const container = document.getElementById('cartItemsContainer');
        document.getElementById('cartTotalItems').innerText = cart.length;

        if (cart.length === 0) {
            container.innerHTML = `<p class="text-center text-muted py-4">Your Cart is empty.</p>`;
            return;
        }

        container.innerHTML = cart.map((item, idx) => `
            <div class="d-flex align-items-center justify-content-between border-bottom py-2">
                <div class="d-flex align-items-center gap-3">
                    <img src="${item.image}" width="50" height="50" class="rounded object-fit-cover">
                    <div>
                        <h6 class="mb-0 fw-bold">${item.title}</h6>
                        <small class="badge bg-light text-dark border me-1">${item.variant}</small>
                        ${item.color ? `<small class="badge bg-light text-dark border">${item.color}</small>` : ''}
                        <div class="text-success fw-bold mt-1">${item.price}</div>
                    </div>
                </div>
                <button class="btn btn-sm btn-outline-danger" onclick="removeFromCart(${idx})"><i class="fa-solid fa-trash"></i></button>
            </div>
        `).join('');
    }

    function checkout() {
        if (cart.length === 0) {
            alert('Your cart is empty!');
            return;
        }
        alert('🎉 Order Request Received! Our team will contact you shortly.');
        cart = [];
        localStorage.setItem('mj_cart', JSON.stringify(cart));
        updateCounters();
        bootstrap.Modal.getInstance(document.getElementById('cartModal')).hide();
    }

    // Initialize
    updateCounters();
    loadProducts();
</script>
</body>
</html>
